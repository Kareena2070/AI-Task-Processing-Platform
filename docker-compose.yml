version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: ai-platform-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=ai-task-platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-platform-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - MONGODB_URI=mongodb://mongodb:27017/ai-task-platform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-task_processing_default_jwt_secret_change_me_32char}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
      - MAX_REQUEST_SIZE=1mb
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: ai-platform-worker
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongodb:27017/ai-task-platform
      - MONGODB_DATABASE=ai-task-platform
      - REDIS_STREAM=task_stream
      - REDIS_CONSUMER_GROUP=task_workers_group
      - REDIS_CONSUMER_NAME=${REDIS_CONSUMER_NAME:-}
      - REDIS_BLOCK_MS=2000
      - REDIS_BATCH_SIZE=10
      - PROCESSING_LEASE_SECONDS=60
      - AUTOCLAIM_MIN_IDLE_MS=70000
      - RECOVERY_POLLING_INTERVAL_SECONDS=10.0
      - MAX_RETRIES=3
      - DEAD_LETTER_STREAM=task_stream:dead_letter
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-platform-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
